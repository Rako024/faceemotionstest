<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Əhval sorğusu</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: transparent; }
  html:not(.material) body { background: var(--wall); }
  .ambient { inset: -40%; }
  .notif {
    position: absolute; inset: 0; padding: 14px 16px 14px; display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--glass-sheen), transparent 40%), var(--glass);
    -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
    box-shadow: inset 0 0 0 0.5px var(--glass-edge);
    transition: opacity 0.4s var(--spring), transform 0.55s var(--spring), filter 0.4s;
  }
  .notif.enter { animation: slide-in 0.6s var(--spring) both; }
  @keyframes slide-in { from { opacity: 0; transform: translateX(28px) scale(0.98); } to { opacity: 1; transform: none; } }
  .notif.done { opacity: 0; transform: scale(0.96); filter: blur(4px); pointer-events: none; }

  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .mini-icon {
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; flex: none;
    background: linear-gradient(160deg, #6ad0ff 0%, #0a84ff 55%, #5e5ce6 100%);
  }
  .mini-icon .i { width: 14px; height: 14px; stroke-width: 2; }
  .app-name { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: var(--label-2); flex: 1; text-transform: uppercase; }
  .when { font-size: 12px; color: var(--label-3); }
  .close {
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--label-2);
    background: var(--fill); transition: background 0.15s;
  }
  .close:hover { background: var(--fill-2); }
  .close .i { width: 12px; height: 12px; stroke-width: 2.4; }

  h1 { font: 600 16px/1.25 var(--font-display); letter-spacing: -0.015em; margin: 0 0 2px; }
  .hint { font-size: 12px; color: var(--label-2); margin: 0 0 10px; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .opt {
    height: 36px; border-radius: 12px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: var(--glass-strong); box-shadow: inset 0 0 0 0.5px var(--glass-edge);
    font-size: 13px; font-weight: 500; text-align: left;
    transition: transform 0.18s var(--spring), background 0.2s, color 0.2s;
  }
  .opt:hover { background: color-mix(in srgb, var(--c) 14%, var(--glass-strong)); }
  .opt:active { transform: scale(0.96); }
  .opt .swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .opt.chosen { background: var(--c); color: #fff; }
  .opt.chosen .swatch { background: #fff; }
  .decline { height: 32px; margin-top: 6px; font-size: 13px; color: var(--accent); font-weight: 500; border-radius: 10px; }
  .decline:hover { background: var(--fill); }

  .countdown { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 8px; }
  .track { flex: 1; height: 3px; border-radius: 2px; background: var(--fill); overflow: hidden; }
  .track i { display: block; height: 100%; width: 100%; background: var(--label-3); border-radius: 2px; transform-origin: left; }
  .secs { font-size: 11px; color: var(--label-3); min-width: 38px; text-align: right; }

  .thanks {
    position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 8px;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .thanks.show { opacity: 1; }
  .thanks .badge {
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: var(--green); box-shadow: 0 8px 24px color-mix(in srgb, var(--green) 40%, transparent);
  }
  .thanks.show .badge { animation: pop 0.55s var(--spring) both; }
  .thanks .badge .i { width: 28px; height: 28px; stroke-width: 2.6; }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="notif" id="notif" role="dialog" aria-labelledby="q">
  <div class="head">
    <span class="mini-icon" data-icon="scan"></span>
    <span class="app-name">Emosiya Pilotu</span>
    <span class="when">indi</span>
    <button class="close" id="close" data-icon="x" aria-label="Bağla (cavab vermək istəmirəm)" title="Bağla"></button>
  </div>
  <h1 id="q">Hazırda özünüzü necə hiss edirsiniz?</h1>
  <p class="hint">İxtiyari · yalnız modelin dəqiqliyini yoxlamaq üçün</p>
  <div class="options" id="options"></div>
  <button class="decline" id="decline"></button>
  <div class="countdown" aria-hidden="true">
    <div class="track"><i id="bar"></i></div><span class="secs num" id="secs"></span>
  </div>
</div>
<div class="thanks" id="thanks" aria-live="polite">
  <span class="badge" data-icon="check"></span>
  <p class="headline">Təşəkkürlər</p>
</div>
<script src="common.js"></script>
<script src="mock.js" data-dev></script>
<script src="prompt.js"></script>
</body>
</html>
