# Emosiya Pilotu — konfiqurasiya
# Bu PİLOT/TEST alətidir: modelin real dəqiqliyini ölçmək üçün.

# Anonim operator ID. Ad, soyad və ya e-poçt YAZMAYIN.
# Format: 2–32 simvol (hərf, rəqəm, "-" və "_"), ən azı bir rəqəm olmalıdır.
operator_id: "OP-7F3A"

model:
  # enet_b0_8_va_mtl (default) | enet_b0_8_best_afew | enet_b2_8 | mbf_va_mtl | mobilevit_va_mtl
  # "_va_mtl" modelləri əlavə olaraq valence/arousal qaytarır.
  # VA nəzarətli testlərdə afew-dan yaxşı çıxıb (balanslı ~82% vs ~71%); afew müqayisədə qalır.
  name: enet_b0_8_va_mtl
  # onnx  → yalnız CPU (kitabxana providerləri CPUExecutionProvider-ə bağlayır)
  # torch → CPU və ya CUDA (requirements-gpu.txt lazımdır)
  engine: onnx
  device: cpu                   # cpu | cuda (cuda yalnız engine: torch ilə)
  # Flip TTA: üz həm orijinal, həm güzgü əksi ilə qiymətləndirilir, ehtimallar ortalanır.
  # Model vaxtı ~2 dəfə artır. Faydası python -m src.evaluate ilə yoxlanır.
  flip_tta: false

# Modellərin müqayisəsi: eyni üz kəsiyi bir neçə modelə verilir, hər biri öz
# smoothing-i ilə işləyir və CSV-yə ayrıca sətir yazır (model_name sütunu).
compare:
  # off  → yalnız model.name
  # auto → aşağıdakı modellər, cəmi vaxt büdcəyə sığdığı qədər (ağırlar avtomatik söndürülür)
  # on   → aşağıdakı modellərin hamısı, büdcəyə baxmadan
  # "off" dırnaqda olmalıdır — YAML dırnaqsız off-u false kimi oxuyur.
  mode: "off"
  models:
    - enet_b0_8_best_afew
    - deepface_emotion
    - vit_fer2013
    - kaggle_fer_cnn
  # auto: bir analizdə bütün modellərin cəmi vaxtı analiz intervalının bu payını keçməsin
  # (1.5 kadr/san → interval 667 ms → büdcə 333 ms)
  budget_ratio: 0.5

detector:
  model_path: models/face_detection_yunet_2023mar.onnx
  score_threshold: 0.8          # bundan aşağı confidence olan kadrlar atılır
  nms_threshold: 0.3
  max_input_side: 640           # aşkarlamadan əvvəl kadr bu ölçüyə kiçildilir
  min_face_px: 80               # daha kiçik üz → "üz yoxdur" (çox uzaq)
  edge_margin_px: 4             # üz kadrın kənarına bu qədər yaxındırsa → kəsik say
  max_yaw_ratio: 0.35           # burnun göz ortasından sapması / göz arası məsafə
  max_roll_deg: 25              # göz xəttinin bucağı
  # Örtülmə (əl, mikrofon, əşya) evristikası: göz və ağız ətrafındakı detalların
  # (gradient sıxlığı) bütün üzə nisbəti bundan aşağıdırsa → "üz yoxdur".
  # YuNet örtülmüş üzü də yüksək confidence ilə tapır, ona görə bu yoxlama lazımdır.
  # 0 → söndürülür.
  min_region_detail: 0.45
  crop_margin: 0.1              # modelə verilən kəsikdə üzün ətrafına əlavə sahə
  # Kəsikdən əvvəl üzü göz xəttinə görə düzləndir (gözlər üfüqi). EmotiEffLib-in bəzi
  # öyrədilmə versiyalarında AffectNet üzləri belə düzləndirilib.
  align: false

capture:
  camera_index: 0
  width: 1280
  height: 720
  analysis_fps: 1.5             # saniyədə emal olunan kadr sayı (0.2–2)

smoothing:
  window_seconds: 10            # hərəkətli ortalama pəncərəsi
  min_frames: 3                 # nəticə göstərmək üçün pəncərədə minimum üzlü kadr
  uncertain_threshold: 0.3      # ən yüksək ehtimal bundan aşağı → "qeyri-müəyyən"

self_report:
  enabled: true
  interval_minutes: 10          # sorğu tezliyi
  timeout_seconds: 30           # cavabsız qalsa avtomatik bağlanır
  # kod: ekranda görünən ad (CSV-də kod saxlanılır)
  categories:
    neutral: "Neytral"
    happy: "Yaxşı / Xoşbəxt"
    tired: "Yorğun"
    angry: "Əsəbi"
    sad: "Kədərli"
    stressed: "Stresli"
  decline_label: "Cavab vermək istəmirəm"

# Modelin 8 sinfi → operatorun öz cavab kateqoriyası (hesabatda müqayisə üçün).
# "tired" (Yorğun) üçün modeldə birbaşa qarşılıq yoxdur.
mapping:
  Anger: angry
  Contempt: angry
  Disgust: angry
  Fear: stressed
  Happiness: happy
  Neutral: neutral
  Sadness: sad
  Surprise: stressed

# Nəzarətli test: ekranda ifadə göstərişləri, tapşırılan ifadə CSV-yə "expected" kimi
# yazılır (record_type: test). Qiymətləndirmə hər kadrın öz nəticəsi ilə aparılır
# (10 s ortalama yox), test kadrları sahə statistikasına qarışmır.
test:
  # EmotiEffLib sinifləri. Contempt (Həqarət) FER2013 modellərində yoxdur və göstərilməsi çətindir.
  expressions: [Neutral, Happiness, Sadness, Surprise, Anger, Fear, Disgust]
  rounds: 2                     # hər ifadə neçə dəfə
  intro_seconds: 4              # başlanğıcda hazırlıq
  prepare_seconds: 3            # hər ifadədən əvvəl: göstərişi oxuyub ifadəyə keçmək
  hold_seconds: 8               # ifadəni saxlamaq — yalnız bu müddətin kadrları qiymətləndirilir
  rest_seconds: 2               # ifadələr arası rahatlama
  shuffle: true                 # raund daxilində sıra təsadüfi (Neytral həmişə birinci)

# Araşdırma: nəzarətli testin kadrlarını diskə yazmaq (hansı model hansı ayarlarda
# ən yaxşıdır — python -m src.evaluate). Adi monitorinqdə şəkil HEÇ VAXT yazılmır.
# Hər testdən əvvəl tester ekranda ayrıca razılıq verir; yalnız "saxlama" mərhələsinin
# kadrları, üz ətrafında kəsilmiş şəkildə saxlanılır. Silmək: python -m src.dataset --delete <sessiya>
research:
  save_test_frames: true        # false → razılıq seçimi göstərilmir, heç nə yazılmır
  dir: dataset
  crop_margin: 0.6              # saxlanılan şəkildə üz qutusunun ətrafına sahə (sonra yenidən kəsmək üçün)
  jpeg_quality: 95

logging:
  dir: logs                     # CSV faylları: logs/YYYY-MM-DD_<operator_id>.csv

ui:
  # Operator modelin nəticəsini ekranda görsün? Dəqiqliyi qərəzsiz ölçmək üçün
  # false ("kor rejim") tövsiyə olunur: nəticəni görən operatorun öz cavabı
  # ona "uyğunlaşa" bilər. Bu halda CSV yenə tam yazılır.
  show_prediction: true
  show_preview: false           # kamera önizləməsi (yalnız yaddaşda, diskə yazılmır)
  preview_fps: 8
  material: auto                # auto | mica | acrylic | none — Windows 11 şüşə fonu

privacy:
  block_network: true           # modellər yükləndikdən sonra bütün şəbəkə bağlantılarını blokla

report:
  dir: reports
  min_group_size: 3             # bundan az operator varsa hesabatda xəbərdarlıq
  # İxtiyari, yalnız _va_mtl modelləri üçün: aşağı arousal → "tired"
  va_tired_rule:
    enabled: false
    arousal_max: -0.3

benchmark:
  frames: 60
  warmup: 5

# Geyim yoxlaması — paneldə "Geyim" kartı (live) və oflayn alət: python -m src.attire <qovluq>
# "Rəsmi" = düyməli köynək/bluzka (rəngi fərq etmir — boz, mavi, naxışlı da) VƏ YA pencək.
# Qalstuk yalnız məlumat üçündür. Model: python scripts/download_models.py --attire
attire:
  model_dir: models/attire/siglip2-base-patch16-224   # SigLIP 2 base (Apache-2.0)
  # Gövdə kəsiyi çənədən aşağı başlayır — üz modelə verilmir. Ölçülər üz qutusuna nisbətəndir:
  # en → üzün eni ilə, hündürlük → üzün hündürlüyü ilə.
  torso_width: 3.4
  torso_height: 2.0
  # Rəngin ölçüldüyü yaxa-döş zonası (pencək və qalstukla belə köynəyin görünən hissəsi)
  collar_width: 1.6
  collar_top: 0.15
  collar_height: 1.0
  # Keyfiyyət filtri — keçməyən şəkil "qiymətləndirilə bilmir" olur, model təxmin etmir
  min_visible: 0.8              # çənədən aşağı kadra düşən minimum hündürlük (kamera yalnız başı çəkirsə)
  min_torso_px: 112             # gövdə kəsiyinin minimum eni, piksel
  # İşıq və kəskinlik ÜZDƏ ölçülür — qara və ya düz rəngli paltar "qaranlıq"/"bulanıq" sayılmasın
  min_brightness: 40            # üzün orta parlaqlığı, 0–255
  min_sharpness: 8              # üzün Laplas dispersiyası (kəskin ~100+, ciddi bulanıq < 8). 0 → söndür
  # Zero-shot mətn təsvirləri (ingiliscə — model ingiliscə öyrədilib). Sual → cavab → təsvirlər;
  # bir cavabın təsvirləri ortalanır. Cavab əlavə etmək / silmək olar, amma bunlar mütləqdir:
  # color.white, tie və jacket-də present/absent. Cavab adlarını dırnaqsız yes/no YAZMAYIN.
  prompts:
    garment:
      shirt:
        - a photo of a person wearing a buttoned dress shirt with a collar
        - a photo of a man wearing a collared dress shirt and a necktie
        - a photo of a person wearing a suit jacket over a collared dress shirt
        - a photo of a woman wearing a button-up blouse with a collar
        - a photo of a person wearing a grey button-up shirt with a collar
        - a photo of a person wearing a striped or checkered button-down shirt
        - a photo of a person wearing a light blue oxford shirt with buttons
      tshirt:
        - a photo of a person wearing a crew neck t-shirt
        - a photo of a person wearing a v-neck t-shirt
        - a photo of a person wearing a blazer over a t-shirt
      polo:
        - a photo of a person wearing a polo shirt with a short button placket
      knitwear:
        - a photo of a person wearing a sweater
        - a photo of a person wearing a hoodie or a sweatshirt
        - a photo of a person wearing a turtleneck
      other:
        - a photo of a person wearing a sports jacket or a tracksuit
        - a photo of a person wearing a uniform or a costume
        - a photo of a person wearing a dress
    color:
      white:
        - a photo of a person wearing a white shirt
        - a photo of a person wearing a dark suit jacket over a white shirt
        - a photo of a person wearing a white blouse
      light_blue:
        - a photo of a person wearing a light blue shirt
      beige:
        - a photo of a person wearing a beige or cream colored shirt
      grey:
        - a photo of a person wearing a grey shirt
      dark:
        - a photo of a person wearing a black or dark navy shirt
      pink:
        - a photo of a person wearing a pink shirt
      patterned:
        - a photo of a person wearing a striped or checkered shirt
      bright:
        - a photo of a person wearing a brightly colored top
    tie:
      present:
        - a photo of a man wearing a necktie
        - a photo of a person wearing a tie with a dress shirt
      absent:
        - a photo of a person with an open collar and no tie
        - a photo of a person wearing a top without a necktie
    # present = klassik pencək / blazer. Hudi, idman gödəkçəsi və s. "absent"-dir — rəsmi pencək deyil.
    jacket:
      present:
        - a photo of a person wearing a suit jacket or a blazer
        - a photo of a person wearing a tailored blazer with lapels over a shirt
      absent:
        - a photo of a person wearing only a shirt without a jacket
        - a photo of a person wearing a top without a jacket
        - a photo of a person wearing a hoodie or a zip-up sweatshirt
        - a photo of a person wearing a casual sports jacket or a windbreaker
  # "Rəsmi" sayılan geyim növləri (prompts.garment cavabları). Polo da rəsmi sayılsın → [shirt, polo]
  formal_garments: [shirt]
  # Qərar: rəsmi = (formal_garments ehtimallarının cəmi >= formal_threshold)
  #               VƏ YA (jacket_is_formal və pencək ehtimalı >= jacket_threshold)
  # Hədlər test şəkilləri ilə kalibrlənir — python -m src.attire <qovluq> ən yaxşı dəyərləri göstərir.
  formal_threshold: 0.5
  jacket_is_formal: true        # pencək varsa — altında nə olursa olsun — rəsmi
  jacket_threshold: 0.5
  # Qara/tünd köynək modelə tünd pencək kimi görünə bilər. Ona görə pencək üçün "iki qat" da görünməlidir:
  # döşün ortasında (yaxaların arası) köynək, yanlarda pencəyin parçası — ortanın bu payı yanlardan fərqli
  # rəngdə olmalıdır. Pencəksiz köynəkdə (qara da olsa) ~0, pencək + köynəkdə adətən 0.4+. 0 → söndür.
  jacket_min_layering: 0.25
  require_white: false          # true → yalnız AĞ köynək rəsmi sayılır (aşağıdakı rəng ayarları ilə)
  # Rəng (yalnız require_white: true olanda qərara təsir edir; həmişə məlumat kimi göstərilir).
  # İki siqnalla yoxlanılır, çünki isti lampa altında ağ köynək sarımtıl görünə bilər:
  #   model  → SigLIP-in "white" cavabının ehtimalı >= white_threshold
  #   pixels → yaxa zonasında ağ piksellərin payı >= white_min_share
  #            (ağ piksel: açıqlıq L* >= white_min_lightness, doyğunluq <= white_max_chroma)
  # color_rule: both (ikisi də) | model | pixels
  white_threshold: 0.4
  white_min_lightness: 60
  white_max_chroma: 20
  white_min_share: 0.15
  color_rule: both
  # Paneldə "Geyim" kartı: canlı kameradan bir neçə kadr → səs çoxluğu. Emosiya analizi dayanmır.
  # Nəticə YALNIZ ekranda göstərilir — CSV-yə yazılmır, kadr saxlanmır. Razılıq ekranında qeyd olunur.
  # Model ilk yoxlamada yüklənir (~15–20 s, +~0.7 GB RAM); torch/transformers lazımdır (requirements-convert.txt).
  live:
    enabled: true
    on_start: true              # kamera açılandan sonra bir dəfə avtomatik; sonra "Yoxla" düyməsi
    frames: 5                   # bir yoxlamada neçə kadr
    interval_s: 0.7             # kadrlar arası fasilə
    threads: 2                  # torch nüvələri — emosiya modeli CPU-suz qalmasın
